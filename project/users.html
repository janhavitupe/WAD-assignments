<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registered Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="fa-solid fa-graduation-cap"></i> Edu<span>Admin</span></div>
  <nav>
    <a href="index.html"><i class="fa fa-gauge"></i> Dashboard</a>
    <a href="register.html"><i class="fa fa-user-plus"></i> Register</a>
    <a href="users.html" class="active"><i class="fa fa-list"></i> User List</a>
  </nav>
</aside>

<div class="main-content">
  <div class="topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="hamburger" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
      <span class="page-title">Registered Users</span>
    </div>
    <div class="user-info">
      <span>Admin</span>
      <div class="avatar">A</div>
    </div>
  </div>

  <div class="users-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0"><i class="fa fa-users me-2 text-primary"></i>User List</h2>
      <a href="register.html" class="btn btn-sm btn-primary">
        <i class="fa fa-plus me-1"></i>Add New
      </a>
    </div>

    <!-- Search -->
    <div class="mb-3">
      <input type="text" id="searchInput" class="form-control" placeholder="Search by name, email or role..." style="max-width:360px;border-radius:8px"/>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover" id="userTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Department</th>
              <th>DOB</th>
              <th>Registered</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="9" class="text-center text-muted py-4">No users registered yet.</td></tr>
          </tbody>
        </table>
      </div>
      <div id="userCount" class="text-muted mt-2" style="font-size:0.82rem"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  loadUsers();

  document.getElementById('searchInput').addEventListener('input', function () {
    const q = this.value.toLowerCase();
    const rows = document.querySelectorAll('#userTableBody tr[data-id]');
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
</script>
</body>
</html>
